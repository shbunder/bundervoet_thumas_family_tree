<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Tree of Renée &amp; Léon Bundervoet</title>
<link rel="stylesheet" href="./assets/css/tree.css?v=150658b3">
</head>
<body>
<!-- Two round switches, sharing a corner. Neither carries a word: the theme one is a
     glyph and the language one is a flag, so neither has to be re-laid-out when the
     page changes language. What they mean is in their title and aria-label, which
     are translated like everything else. -->
<div class="chrome">
  <button id="themeBtn" class="rnd"></button>
  <button id="langBtn" class="rnd"></button>
</div>
<div class="wrap">
  <header>
    <div class="crest">❦</div>
    <!-- The names come from the records, not from this markup, so the page cannot go
         on naming somebody the data no longer calls the root. See main.js. -->
    <h1 id="pagetitle"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="explore" data-i18n="tabTree"></button>
    <button class="tab" data-view="lineages" data-i18n="tabLineages"></button>
    <button class="tab" data-view="everyone" data-i18n="tabIndex"></button>
    <button class="tab" data-view="relations" data-i18n="tabRelations"></button>
    <div class="searchbox" id="searchbox">
      <span class="ic">⌕</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             data-i18n-attr="placeholder:searchPlaceholder;aria-label:searchAria">
      <button class="clr" id="qClear" data-i18n-attr="title:clearSearch;aria-label:clearSearch">×</button>
    </div>
  </div>
  <div class="toprow">
    <span class="tip" id="tip"></span>
  </div>

  <div class="legend" id="legend"></div>

  <!-- EXPLORE -->
  <div class="view active" id="view-explore">
    <div class="controls">
      <!-- labelled from the data at load time; see main.js -->
      <button class="btn" id="homeBtn"></button>
      <button class="btn" id="backBtn" data-i18n="back"></button>
    </div>
    <p class="hint" data-i18n="exploreHint"></p>
    <div class="ped" id="ped"></div>
    <div class="detail" id="detail"></div>
  </div>

  <!-- LINEAGES -->
  <div class="view" id="view-lineages">
    <!-- filled in from the data at load time; see main.js -->
    <p class="hint" id="linehint"></p>
    <div class="cols" id="cols"></div>
  </div>

  <!-- EVERYONE -->
  <div class="view" id="view-everyone">
    <p class="hint" data-i18n="indexHint"></p>

    <!-- Both dimensions are derived from the links and the records, so regrouping
         the index rewrites nothing — see indexCards() in render.js. -->
    <div class="indexctl">
      <div class="ctlgroup">
        <span class="ctllab" data-i18n="groupBy"></span>
        <div class="segs" id="groupBy" role="radiogroup"
             data-i18n-attr="aria-label:groupBy"></div>
      </div>
      <div class="ctlgroup">
        <span class="ctllab" data-i18n="sortBy"></span>
        <div class="segs" id="sortBy" role="radiogroup"
             data-i18n-attr="aria-label:sortBy"></div>
      </div>
    </div>

    <div id="branchgrid"></div>
  </div>

  <!-- RELATIONS — objective (c): name the relation between any two people.
       Its own tab rather than a panel above the roster: the roster answers "who is
       in this tree", this answers "what are these two to each other", and the two
       questions were only ever together because there was nowhere else to put the
       second one. -->
  <div class="view" id="view-relations">
    <p class="hint" data-i18n="relHint"></p>
    <div class="relfinder">
      <div class="relpick">
        <select id="relA" data-i18n-attr="aria-label:relFirst"></select>
        <span class="amp" data-i18n="relAnd"></span>
        <select id="relB" data-i18n-attr="aria-label:relSecond"></select>
      </div>
      <div class="relout" id="relOut"></div>
    </div>
  </div>

  <!-- SEARCH RESULTS (no tab of its own — the search box opens it) -->
  <div class="view" id="view-search">
    <div id="results"></div>
  </div>

  <footer id="foot"></footer>
</div>

<!-- How whoever is in focus connects back to the root of the tree.
     Labelled from the data at load time; see main.js -->
<button id="lineBtn" aria-expanded="false" aria-controls="linepanel">
  <span class="lbl"></span>
</button>
<aside id="linepanel" class="collapsed" aria-hidden="true">
  <header>
    <h4 id="lineTitle"></h4>
    <button id="lineClose" data-i18n-attr="title:close;aria-label:close">×</button>
  </header>
  <div id="lineBody"></div>
</aside>

<div id="tt"></div>

<!-- Plain scripts, not modules, so the page also works opened straight from disk. -->
<script src="./assets/js/core.js?v=150658b3"></script>

<!-- One request for the whole tree. Generated by tools/build.py from the files
     in data/ — those stay the source of truth; this is what the page reads. -->
<script src="./dist/bundle.js?v=150658b3"></script>

<script src="./assets/js/i18n.js?v=150658b3"></script>
<script src="./assets/js/kinship.js?v=150658b3"></script>
<script src="./assets/js/search.js?v=150658b3"></script>
<script src="./assets/js/render.js?v=150658b3"></script>
<script src="./assets/js/ui.js?v=150658b3"></script>
<script src="./assets/js/main.js?v=150658b3"></script>
</body>
</html>
